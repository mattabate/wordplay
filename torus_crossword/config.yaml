main: # for ./run
  # mode
  mode: DA
  max_walls: 42
  f_search_with_flipped: true
  # timer
  f_verbose: False
  sleep_duration: -1
  restart_at_level: -1
  # word save
  f_save_words_used: false
  f_save_bounds: [0, 300]
  max_level_for_active_add: 2

backward_search: # for ./last which converts grid templates to bad templates
  sleep_duration_grid: 1000
  f_verbose: false
  f_save_words_used: false
  grid_kill_step: 5


filter_solutions:
  mode: DA
  max_walls: 42
  f_search_with_flipped: true
  f_reomve_duplicates: False
  f_save_words_in_solutions: True
  f_reomve_duplicates_bad: False 

api_sort_parameters:
  word_source: solutions # active_grids # solutions 
  without_clues_only: false
  delete_active: true

search_templates_plus_living:
  mode: DA 
  max_walls: 42
  f_search_with_flipped: true
  f_save_words_used: false
  f_verbose: true
  restart_at_level: -1
